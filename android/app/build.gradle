plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zencounter.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.zencounter.app"
        minSdk 24
        // Требование Google Play с 31.08.2026: новые приложения — Android 16 (API 36).
        targetSdk 36
        versionCode 6
        versionName "1.0.5"
    }

    // Ключ публикации в Google Play: android/release.keystore + keystore.properties.
    // Файлы не хранятся в git — их нужно держать локально и в надёжном бэкапе.
    def ksFile = rootProject.file("release.keystore")
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file("keystore.properties")
    if (ksFile.exists() && ksPropsFile.exists()) {
        ksPropsFile.withInputStream { ksProps.load(it) }
        signingConfigs {
            release {
                storeFile ksFile
                storePassword ksProps.getProperty('storePassword')
                keyAlias ksProps.getProperty('keyAlias')
                keyPassword ksProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Play-сборка подписывается release-ключом (загрузочный ключ App Bundle).
            // APK для GitHub собирается вручную и остаётся на debug-ключе,
            // чтобы установленное из GitHub приложение обновлялось поверх.
            if (ksFile.exists() && ksPropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Внешних зависимостей нет: ресурсы раздаются из assets собственным
// shouldInterceptRequest (см. MainActivity), поэтому проект собирается
// быстрее и не требует доступа к Maven.
