<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Дзен счётчик — медитативный счётчик повторений: точные интервалы, красочные темы, звуки и вибрация."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дзен счётчик" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta property="og:title" content="Дзен счётчик" />
    <meta property="og:description" content="Медитативный счётчик повторений с точным ритмом" />
    <meta property="og:type" content="website" />
    <title>Дзен счётчик</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Красивая анимированная заставка -->
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-glow splash-glow-a"></div>
      <div class="splash-glow splash-glow-b"></div>
      <div class="splash-particles" id="splash-particles"></div>
      <div class="splash-core">
        <svg class="splash-enso" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="45%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#fbbf24" />
            </linearGradient>
            <filter id="splashBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
          </defs>
          <circle class="enso-halo" cx="120" cy="120" r="86" pathLength="100" />
          <circle class="enso-ring" cx="120" cy="120" r="86" pathLength="100" />
          <circle class="enso-orb" cx="120" cy="34" r="7" />
          <g class="splash-lotus">
            <path d="M120 86 C108 98 108 118 120 130 C132 118 132 98 120 86 Z" />
            <path d="M99 100 C86 106 82 122 92 132 C105 126 109 111 99 100 Z" />
            <path d="M141 100 C154 106 158 122 148 132 C135 126 131 111 141 100 Z" />
            <path d="M80 118 C69 126 68 142 78 149 C90 141 91 127 80 118 Z" />
            <path d="M160 118 C171 126 172 142 162 149 C150 141 149 127 160 118 Z" />
          </g>
        </svg>
        <div class="splash-title"><span>Дзен</span><span class="splash-title-b">счётчик</span></div>
        <div class="splash-sub">точный ритм · спокойный счёт</div>
      </div>
      <button class="splash-skip" type="button" id="splash-skip">коснитесь, чтобы пропустить</button>
    </div>

    <div id="app" class="app-shell">
      <header class="app-header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="brand-ring" cx="24" cy="24" r="16" pathLength="100" />
            <circle class="brand-dot" cx="24" cy="8" r="3" />
          </svg>
          <span class="brand-title">Дзен&nbsp;счётчик</span>
        </div>
        <div class="header-actions">
          <button class="chip-button" type="button" data-action="open-themes" aria-label="Сменить тему">
            <span class="chip-swatch" aria-hidden="true"></span><span class="chip-label">Тема</span>
          </button>
          <button class="round-button round-button-sm" type="button" data-action="mute" aria-label="Звук"></button>
        </div>
      </header>

      <main id="main" class="main-content" aria-live="polite"></main>
      <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация"></nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <script src="app.js" defer></script>
  </body>
</html>
